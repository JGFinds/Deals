name: Update deals-feed

on:
  schedule:
    # Twice daily: 07:00 and 19:00 UTC (adjust to your timezone)
    - cron: '0 7 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      SELENIUM_MODE: 'false'  # change to 'true' if you want Selenium (see below)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Optional Selenium setup (only if SELENIUM_MODE=true)
      - name: Setup Chrome for Selenium (optional)
        if: env.SELENIUM_MODE == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xvfb libxi6 libgconf-2-4
          # install Chrome
          wget -q -O /tmp/google-chrome-stable_current_amd64.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || sudo apt-get -fy install
          # install chromedriver via apt or latest
          CHROME_VER=$(google-chrome --version | sed -E 's/.* ([0-9]+).*/\\1/')
          LATEST=$(curl -sS chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VER)
          wget -q -O /tmp/chromedriver.zip "https://chromedriver.storage.googleapis.com/$LATEST/chromedriver_linux64.zip"
          unzip /tmp/chromedriver.zip -d /tmp
          sudo mv /tmp/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver

      - name: Run scraper
        run: |
          python scraper.py

      - name: Commit and push deals-feed.json
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals-feed.json || true
          git commit -m "Auto-update deals feed: $(date -u +"%Y-%m-%d %H:%M UTC")" || echo "nothing to commit"
          git push https://${{ secrets.GH_PUSH_TOKEN }}@github.com/${{ github.repository }} HEAD:main
