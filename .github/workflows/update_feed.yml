name: Validate deals feed

on:
  push:
    paths:
      - deals-feed.json
      - .github/workflows/update_feed.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check feed structure and source links
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          feed = json.loads(Path("deals-feed.json").read_text(encoding="utf-8"))
          sections = ("hot_deals", "shoes", "mens_clothing", "womens_clothing", "flash_sales")
          assert isinstance(feed, dict), "Feed must be a JSON object"
          for section in sections:
              assert isinstance(feed.get(section), list), f"{section} must be a list"
              for item in feed[section]:
                  assert isinstance(item, dict) and isinstance(item.get("name"), str) and item["name"].strip(), f"{section}: item needs a name"
                  if section == "flash_sales" and not item.get("link"):
                      continue
                  url = item.get("link")
                  assert isinstance(url, str), f"{section}: item needs a source link"
                  parsed = urlsplit(url)
                  assert parsed.scheme == "https" and parsed.hostname and not parsed.username and not parsed.password, f"{section}: source link must use HTTPS without credentials"
                  assert parsed.hostname not in {"example.com", "example.org", "example.net", "localhost"} and not parsed.hostname.endswith((".example", ".test", ".invalid")), f"{section}: placeholder link"
          print("Feed structure and source links passed.")
          PY
